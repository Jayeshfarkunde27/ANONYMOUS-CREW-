<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat - To-Let</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-light bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand" href="/">To-Let</a>
    <a href="{{ url_for('notifications') }}" class="btn btn-outline-secondary">Back</a>
  </div>
</nav>

<div class="container my-4">
  <h4>Chat with {{ req.seeker_name }}</h4>
  <div class="card mb-3">
    <div class="card-body" style="max-height:400px; overflow:auto;">
      {% for m in messages %}
        <div class="mb-2">
          <small class="text-muted">{{ m.created_at.strftime('%H:%M %d-%b') }}</small>
          <div class="p-2 mt-1 rounded {{ 'bg-light' if m.sender_id == current_user.id else 'bg-primary text-white' }}">
            {{ m.text }}
          </div>
        </div>
      {% else %}
        <div class="text-muted">No messages yet. Start the conversation.</div>
      {% endfor %}
    </div>
  </div>

  <form method="POST">
    <div class="mb-2">
      <textarea name="text" class="form-control" rows="3" placeholder="Type your message..."></textarea>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">Send</button>
      <a href="tel:{{ req.seeker_phone }}" class="btn btn-success">Call</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
