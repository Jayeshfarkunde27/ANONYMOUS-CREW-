<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat - To-Let</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
    }
    
    .navbar {
      background: white !important;
      box-shadow: 0 4px 20px rgba(0, 102, 255, 0.08);
      border-bottom: 1px solid #e2e8f0;
    }
    
    .container {
      max-width: 700px;
    }
    
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      background: white;
      margin-bottom: 24px;
    }
    
    .card-body {
      padding: 24px;
    }
    
    .card-body h4 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0;
    }
    
    .chat-messages {
      max-height: 450px;
      overflow-y: auto;
      padding: 16px 0;
      background: #f9fafb;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    
    .message {
      display: flex;
      margin-bottom: 16px;
      padding: 0 16px;
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .message.sent {
      justify-content: flex-end;
    }
    
    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
    }
    
    .message.sent .message-content {
      background: linear-gradient(135deg, var(--primary) 0%, #0052cc 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .message.received .message-content {
      background: white;
      color: var(--text);
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    
    .message-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }
    
    .message.sent .message-time {
      text-align: right;
    }
    
    textarea {
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      padding: 12px 16px;
      transition: all 0.3s;
    }
    
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
      outline: none;
    }
    
    .btn {
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 8px;
      transition: all 0.3s;
      border: none;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #0052cc 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
      color: white;
    }
    
    .btn-success {
      background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
      color: white;
    }
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      color: white;
    }
    
    .btn-outline-secondary {
      border: 2px solid #cbd5e1;
      color: var(--text-muted);
    }
    .btn-outline-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: transparent;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-light">
  <div class="container-lg">
    <a class="navbar-brand" href="/">To-Let 🏠</a>
    <a href="{{ url_for('notifications') }}" class="btn btn-outline-secondary">
      <i class="fas fa-arrow-left me-2"></i> Back
    </a>
  </div>
</nav>

<div class="container my-5">
  <div class="card">
    <div class="card-body">
      <h4><i class="fas fa-user-circle me-2" style="color: var(--primary);"></i>{{ req.seeker_name }}</h4>
    </div>
  </div>
  
  <div class="card">
    <div class="card-body">
      <div class="chat-messages">
        {% if messages %}
          {% for m in messages %}
            <div class="message {% if m.sender_id == current_user.id %}sent{% else %}received{% endif %}">
              <div>
                <div class="message-content">
                  {{ m.text }}
                </div>
                <div class="message-time">{{ m.created_at.strftime('%H:%M %d-%b') }}</div>
              </div>
            </div>
          {% endfor %}
        {% else %}
          <div class="text-center text-muted py-4">
            <i class="fas fa-comment me-2"></i>No messages yet. Start the conversation!
          </div>
        {% endif %}
      </div>
      
      <form method="POST">
        <div class="mb-3">
          <textarea name="text" class="form-control" rows="3" placeholder="Type your message..." required></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary flex-grow-1">
            <i class="fas fa-paper-plane me-2"></i>Send
          </button>
          {% if req.seeker_phone %}
          <a href="tel:{{ req.seeker_phone }}" class="btn btn-success">
            <i class="fas fa-phone me-2"></i>Call
          </a>
          {% endif %}
        </div>
      </form>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
  // Auto-scroll to bottom
  const chatDiv = document.querySelector('.chat-messages');
  if (chatDiv) {
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }
</script>
</body>
</html>
