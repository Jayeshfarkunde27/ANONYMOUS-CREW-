<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search results</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <style>
    .container{max-width:1100px;margin:28px auto;padding:0 16px}
    .card{background:#fff;padding:12px;border-radius:10px;border:1px solid rgba(0,0,0,0.04)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <h2>Results — {{ qtype|capitalize }}</h2>
    <div class="grid">
      {% for p in properties %}
      <div class="card">
        <div style="font-weight:700">{{ p.room_type }}</div>
        <div class="text-muted">{{ p.address }}</div>
        <div style="margin-top:8px">Rent: ₹{{ p.rent }}</div>
        <div style="margin-top:10px;display:flex;gap:8px">
          <a class="btn btn-outline-secondary" href="{{ url_for('view_property', property_id=p.id) }}">View</a>
          <form method="post" action="{{ url_for('wishlist_toggle', property_id=p.id) }}">
            <button class="btn btn-primary" type="submit">Save</button>
          </form>
        </div>
      </div>
      {% else %}
      <div class="card">No properties found.</div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
