<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-let - Home</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <style>
        body {
            background: 
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5)),
                url('https://girlshostelsinmultan.com/wp-content/uploads/2025/12/creating-a-study-space-in-a-girls-hostel-1.webp') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-attachment: fixed;
        }
        .home-card {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
            padding: 80px 60px;
            max-width: 620px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .tagline {
            color: var(--text);
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 70px;
            line-height: 1.6;
        }
        .btn-auth {
            padding: 22px;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 18px;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-md);
        }
        .btn-login {
            background: linear-gradient(135deg, var(--primary), #007bff);
            border: none;
            color: white;
        }
        .btn-login:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }
        .btn-signup {
            background: white;
            color: var(--primary);
            border: 4px solid var(--primary);
        }
        .btn-signup:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }
        .footer-text {
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 1.2rem;
            font-weight: 500;
        }
        .d-grid {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xl);
        }
        .d-grid a {
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="home-card">
        <div class="logo">
            <i class="fas fa-building"></i> To-Let
        </div>
        <p class="tagline">Find your perfect PG or room securely & instantly</p>

        <div class="d-grid">
            <a href="/auth?mode=login" class="btn btn-auth btn-login">
                Login
            </a>
            <a href="/auth?mode=signup" class="btn btn-auth btn-signup">
                Sign Up
            </a>
        </div>

        <p class="footer-text">
            🔒 Secure • Password Login • Instant Access
        </p>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
