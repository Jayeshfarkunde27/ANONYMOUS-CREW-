<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Your Role — TO-LET</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <style>
        :root { --card-radius: 24px; }
        html,body { height: 100%; }
        body {
            background: linear-gradient(135deg, #eef6ff 0%, #f7fbff 50%, #ffffff 100%);
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 40px 16px;
            color: var(--text);
        }

        .role-shell {
            width: 100%;
            max-width: 940px;
            background: linear-gradient(180deg, rgba(255,255,255,0.85), #ffffff);
            border-radius: var(--card-radius);
            padding: 48px;
            box-shadow: 0 24px 60px rgba(12, 46, 120, 0.12);
            border: 1px solid rgba(15, 76, 255, 0.04);
        }

        .role-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 18px;
        }

        .brand-mark {
            width: 62px;
            height: 62px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            font-weight: 800;
            box-shadow: 0 8px 24px rgba(0, 82, 204, 0.15);
            font-size: 1.25rem;
        }

        .role-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin: 0;
        }

        .role-sub {
            margin: 6px 0 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .roles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 28px;
        }

        .role-btn {
            background: white;
            border-radius: 14px;
            padding: 26px 22px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            text-align: left;
            border: 1px solid rgba(15, 76, 255, 0.06);
            cursor: pointer;
            transition: transform var(--transition-base), box-shadow var(--transition-base), border-color var(--transition-base);
        }

        .role-btn:focus {
            outline: none;
            box-shadow: 0 6px 24px rgba(15,76,255,0.14);
            transform: translateY(-6px);
            border-color: var(--primary);
        }

        .role-top {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        .role-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 1.45rem;
            color: white;
        }

        .icon-owner { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }
        .icon-seeker { background: linear-gradient(135deg, var(--success) 0%, #1fae62 100%); }

        .role-name { font-weight: 700; font-size: 1.05rem; color: var(--text-dark); }
        .role-desc { color: var(--text-muted); font-size: 0.95rem; }

        .role-cta { margin-left: auto; display:flex; gap:8px; align-items:center }

        .small-note { margin-top: 18px; color: var(--text-muted); font-size: 0.95rem; }

        @media (max-width: 720px) {
            .roles-grid { grid-template-columns: 1fr; }
            .role-shell { padding: 28px; }
            .brand-mark { width: 52px; height: 52px; }
        }
    </style>
</head>
<body>

    <div class="role-shell">
        <div class="role-header">
            <div class="brand-mark">TO</div>
            <div>
                <h2 class="role-title">Choose your role</h2>
                <div class="role-sub">Select how you want to use TO-LET — you can switch later from settings.</div>
            </div>
        </div>

        <form method="POST" class="role-form" aria-label="Role selection">
            <div class="roles-grid">
                <button type="submit" name="role" value="room_owner" class="role-btn" aria-pressed="false">
                    <div class="role-top">
                        <div class="role-icon icon-owner"><i class="fas fa-building"></i></div>
                        <div>
                            <div class="role-name">Room / Property Owner</div>
                            <div class="role-desc">List properties, manage bookings, respond to requests.</div>
                        </div>
                        <div class="role-cta"><i class="fas fa-chevron-right text-muted"></i></div>
                    </div>
                </button>

                <button type="submit" name="role" value="seeker" class="role-btn" aria-pressed="false">
                    <div class="role-top">
                        <div class="role-icon icon-seeker"><i class="fas fa-search"></i></div>
                        <div>
                            <div class="role-name">Room Seeker</div>
                            <div class="role-desc">Browse listings, save favorites, contact owners.</div>
                        </div>
                        <div class="role-cta"><i class="fas fa-chevron-right text-muted"></i></div>
                    </div>
                </button>
            </div>

            <p class="small-note">Tip: You can change this later from your profile settings.</p>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
